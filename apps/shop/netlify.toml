# 쇼핑몰 사이트. Netlify UI에서 Package directory를 apps/shop으로 정한다. (base는 저장소 루트)
# 경로는 base 디렉터리(저장소 루트) 기준이다.
[build]
  command = "pnpm turbo run build --filter=shop"
  publish = "apps/shop/.next"

[functions]
  directory = "apps/shop/netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "24"
