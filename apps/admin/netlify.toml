# 어드민 사이트. Netlify UI에서 Package directory를 apps/admin으로 정한다. (base는 저장소 루트)
# DB는 쇼핑몰 사이트의 Netlify Database를 MFG_DATABASE_URL로 함께 쓴다.
[build]
  command = "pnpm turbo run build --filter=admin"
  publish = "apps/admin/.next"

[build.environment]
  NODE_VERSION = "24"

# 검색 엔진에 노출하지 않는다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
