name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter shop build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
      - run: pnpm --filter shop exec playwright install --with-deps chromium
      - name: E2E (쇼핑몰)
        run: pnpm --filter shop test:e2e
        env:
          CI: "1"
      - name: E2E (어드민 + 쇼핑몰)
        run: pnpm --filter admin test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/*/test-results/
          retention-days: 7
