name: Production smoke

# Vercel이 운영 배포를 마치면 GitHub에 deployment_status를 보낸다. 그때 실제 주소를 검사한다.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shop exec playwright install --with-deps chromium
      - run: pnpm --filter shop test:smoke
        env:
          CI: "1"
