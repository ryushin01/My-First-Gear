name: Production smoke

# Vercel이 배포를 마치면 저장소로 repository_dispatch(vercel.deployment.success)를 보낸다.
# 운영 배포일 때 실제 주소를 읽기 전용으로 검사한다.
on:
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.environment == 'production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shop exec playwright install --with-deps chromium
      - run: pnpm --filter shop test:smoke
        env:
          CI: "1"
